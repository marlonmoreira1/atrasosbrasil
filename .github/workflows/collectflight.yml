# .github/workflows/flight_pipeline.yml

name: Daily Flight Collection

on:
  schedule:
    - cron: '0 7 * * *'

  workflow_dispatch:

jobs:

  collect-and-load-data:

    runs-on: windows-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run scraper
      env:
        CONNECT_STR: ${{ secrets.CONNECT_STR }}
        CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
        AIRLABS_API_KEY: ${{ secrets.AIRLABS_API_KEY }}
      run: |
        python scraper.py

    - name: Bronze to Silver
      env:
        CONNECT_STR: ${{ secrets.CONNECT_STR }}
        CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
        CONTAINER_PRATA: ${{ secrets.CONTAINER_PRATA }}
      run: |
        python camadas/bronzetoprata.py

    - name: Silver to Gold
      env:
        CONNECT_STR: ${{ secrets.CONNECT_STR }}
        CONTAINER_PRATA: ${{ secrets.CONTAINER_PRATA }}
        CONTAINER_OURO: ${{ secrets.CONTAINER_OURO }}
      run: |
        python camadas/pratatoouro.py
