name: Daily Flight Collection

on:
  schedule:
    - cron: '0 7 * * *'

  workflow_dispatch:

jobs:

  collect-and-process:

    runs-on: windows-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |

        python -m pip install --upgrade pip

        pip install pandas
        pip install pyarrow
        pip install requests
        pip install azure-storage-blob

    - name: Run scraper
      env:
        CONNECT_STR: ${{ secrets.CONNECT_STR }}
        CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
        AIRLABS_API_KEY: ${{ secrets.AIRLABS_API_KEY }}

      run: |
        python scraper.py

    - name: Bronze to Silver
      env:
        CONNECT_STR: ${{ secrets.CONNECT_STR }}
        CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
        CONTAINER_PRATA: ${{ secrets.CONTAINER_PRATA }}

      run: |
        python camadas/bronzetoprata.py

    - name: Silver to Gold
      env:
        CONNECT_STR: ${{ secrets.CONNECT_STR }}
        CONTAINER_PRATA: ${{ secrets.CONTAINER_PRATA }}
        CONTAINER_OURO: ${{ secrets.CONTAINER_OURO }}

      run: |
        python camadas/pratatoouro.py
